name: Claude Issue Resolver

on:
  issues:
    types: [labeled]

jobs:
  build_pr:
    if: github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Aider via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          aider --model claude-3-5-sonnet --message "Lies Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. ${{ github.event.issue.body }}" --yes --auto-commits
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Implementierung: ${{ github.event.issue.title }}"
          body: "Dieser PR wurde durch Claude generiert, basierend auf Issue #${{ github.event.issue.number }}."
          branch: "feature/issue-${{ github.event.issue.number }}"
          token: ${{ secrets.GITHUB_TOKEN }}
